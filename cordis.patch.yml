# dshremote-bridge：DSH Remote 的电脑端桥插件。
# 用 `dsh plugin --profile desktop add -w <本目录>` 或 plugin_manager 的 install_bundle 装入后，
# 由 profile 的 cordis 加载；同名覆盖会整体替换 config，改配置请直接改这里。
- insert:
    - id: dshremote-bridge
      name: dshremote-bridge
      config:
        enabled: true

        # 手机连的桥端口（局域网 http://<电脑IP>:3088）。
        port: 3088
        bind: 0.0.0.0

        # 为空则沿用 ~/.dsh/dshremote-bridge.token；这个值重启后不会变，手机配一次就行。
        token: ''

        # DSH Web 只监听回环，这里由桥在 7627 上做一层反向代理给手机用。
        # upstreamPort 只是兜底：运行时以宿主 webServer 的实际端口为准，不用改。
        proxyEnabled: true
        proxyPort: 7627
        upstreamHost: 127.0.0.1
        upstreamPort: 7626

        # 通知正文长度。
        answerHeadChars: 120
        questionChars: 200

        # 空 = ~/.dsh/dshremote-bridge.log
        logFile: ''

        # 固定公网地址（Cloudflare 命名隧道，地址永久不变）。
        publicUrl: 'https://dsh.charlie-dshmobile.xyz'
        publicUrlFile: ''

        # 额外的可信 host（公网域名），会被塞进 DSH 的 trustedHosts，否则公网访问 403。
        extraHosts:
          - 'dsh.charlie-dshmobile.xyz'
        hostsFile: ''

        # 局域网自动发现：每 2 秒向 255.255.255.255:3089 广播「我是谁、在哪、端口」，
        # 手机 App 监听同一端口就能免手填直连。不想暴露就设成 false。
        discovery: true
        discoveryPort: 3089

        # 隧道：
        #   auto = 由桥自己拉起 cloudflared 快速隧道（地址每次变，进程挂了自动重启）
        #   off  = 不自动起（配合上面的 publicUrl 用固定地址，如 Cloudflare 命名隧道）
        # 本机已改用命名隧道（~/.cloudflared/config.yml），故设为 off。
        tunnel: off
        # 留空自动探测：CLOUDFLARED_PATH 环境变量 → PATH → 常见安装位置。
        # 没装 cloudflared 就不会有公网地址，局域网直连照常可用。
        cloudflaredPath: ''
        tunnelProtocol: http2
